spring.application.name=agendamento-api
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Fortaleza

spring.thymeleaf.cache=false

app.nome=Sistema de Agendamento de Consultas
app.security.admin.username=${APP_SECURITY_ADMIN_USERNAME:admin}
app.security.admin.password=${APP_SECURITY_ADMIN_PASSWORD:admin123}
app.security.atendente.username=${APP_SECURITY_ATENDENTE_USERNAME:atendente}
app.security.atendente.password=${APP_SECURITY_ATENDENTE_PASSWORD:atendente123}
